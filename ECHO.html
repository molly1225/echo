<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ECHO - 靠近我 听见我</title>
    <style>
        :root {
            --bg-deep: #0f0205;
            --primary-pink: #ff4d6d; 
            --soft-pink: #ffb3c1;
            --glass-border: rgba(255, 77, 109, 0.3);
            --text-main: rgba(255, 240, 245, 0.95);
            --text-sub: rgba(255, 200, 210, 0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; user-select: none; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Times New Roman', 'Songti SC', serif;
            background-color: var(--bg-deep);
            height: 100vh; color: var(--text-main);
            overflow: hidden; position: relative;
        }

        /* 背景装饰层 */
        #particle-canvas { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
        .ambient-bg { position: fixed; inset: 0; z-index: 0; }
        .glow-spot { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.3; animation: breathe 10s infinite alternate; }
        .spot-1 { top: -10%; left: -10%; width: 60vw; height: 60vw; background: #590d22; }
        .spot-2 { bottom: -10%; right: -10%; width: 70vw; height: 70vw; background: #800f2f; animation-delay: -5s; }
        @keyframes breathe { 0% { opacity: 0.2; transform: scale(1); } 100% { opacity: 0.4; transform: scale(1.1); } }

        .card-river { position: fixed; inset: 0; z-index: 1; perspective: 800px; overflow: hidden; }
        .phantom-card { position: absolute; background: rgba(255, 77, 109, 0.05); border: 1px solid rgba(255, 77, 109, 0.1); border-radius: 15px; width: 200px; height: 280px; animation: flowUp linear infinite; }
        @keyframes flowUp { 0% { transform: translate3d(var(--x), 110vh, var(--z)) rotateX(20deg); opacity: 0; } 100% { transform: translate3d(var(--x), -20vh, var(--z)) rotateX(20deg); opacity: 0; } }

        /* UI架构 */
        .ui-layer { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        header { padding: 30px; text-align: center; position: relative; }
        .settings-trigger { position: absolute; top: 25px; right: 25px; font-size: 36px; opacity: 0.6; cursor: pointer; transition: 0.3s; z-index: 30; }
        .logo { font-size: 2.5rem; letter-spacing: 8px; font-weight: bold; background: linear-gradient(to bottom, #fff, var(--soft-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255, 77, 109, 0.5); }
        .slogan { font-size: 0.8rem; letter-spacing: 4px; color: var(--primary-pink); margin-top: 5px; opacity: 0.8; font-style: italic; }

        /* 核心卡牌舞台 */
        .stage { flex: 1; display: flex; justify-content: center; align-items: center; perspective: 1500px; }
        .main-card {
            width: 80%; max-width: 320px; height: 440px;
            background: rgba(30, 10, 15, 0.6); backdrop-filter: blur(25px);
            border: 2px solid var(--glass-border); border-radius: 20px;
            display: flex; justify-content: center; align-items: center; padding: 35px; text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            transform-style: preserve-3d;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* 动画状态：洗牌 */
        .shuffling {
            opacity: 0.6;
            filter: blur(1px);
            animation: shuffleSoft 0.2s infinite alternate ease-in-out;
        }
        @keyframes shuffleSoft {
            0% { transform: scale(0.9) rotateZ(-2deg) translateY(5px); }
            100% { transform: scale(0.9) rotateZ(2deg) translateY(-5px); }
        }

        /* 动画状态：3D丝滑飞入 */
        .drawing-active {
            animation: cardFlyInSmooth 0.85s cubic-bezier(0.15, 0.85, 0.35, 1.1) forwards;
        }
        @keyframes cardFlyInSmooth {
            0% { 
                opacity: 0; 
                transform: translate3d(0, 500px, -500px) rotateX(40deg) rotateY(-90deg) scale(0.5);
                filter: blur(10px);
            }
            60% { opacity: 1; filter: blur(2px); }
            100% { 
                opacity: 1; 
                transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) scale(1);
                filter: blur(0);
            }
        }

        #q-content { font-size: 1.4rem; line-height: 1.6; color: var(--text-main); font-weight: 300; transition: opacity 0.4s; }

        /* 底部控制区 */
        .footer { padding-bottom: 50px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .btn-pulse {
            padding: 18px 70px; background: rgba(255, 77, 109, 0.1);
            border: 1px solid var(--primary-pink); color: var(--primary-pink); font-size: 1.1rem; letter-spacing: 3px;
            border-radius: 50px; cursor: pointer; transition: 0.4s; box-shadow: 0 0 20px rgba(255, 77, 109, 0.2);
        }
        .btn-pulse:active { transform: scale(0.9); background: var(--primary-pink); color: #fff; }
        .btn-pulse:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; color: #555; }

        .footer-links { display: flex; gap: 50px; }
        .link-item { font-size: 0.9rem; color: var(--text-sub); cursor: pointer; padding: 10px; transition: 0.3s; }
        .link-item:active { color: #fff; }

        /* 弹窗样式 */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(15px); opacity: 0; transition: 0.4s; }
        .modal.show { display: flex; opacity: 1; }
        .modal-box { width: 85%; max-width: 340px; background: #1a0508; border: 1px solid #330a12; padding: 35px 25px; border-radius: 20px; text-align: center; }
        .modal-title { color: var(--primary-pink); font-size: 1.1rem; margin-bottom: 20px; font-weight: bold; }
        textarea { width: 100%; height: 150px; background: #0b0103; border: 1px solid #330a12; color: var(--soft-pink); padding: 12px; margin: 15px 0; border-radius: 10px; resize: none; }
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        .btn-small { flex: 1; padding: 12px; border-radius: 10px; border: none; cursor: pointer; }
        .btn-confirm { background: var(--primary-pink); color: white; }
        .btn-cancel { background: transparent; border: 1px solid #330a12; color: #888; }
        .history-list { max-height: 250px; overflow-y: auto; text-align: left; }
        .history-item { padding: 12px 0; border-bottom: 1px solid #25080e; color: var(--text-sub); font-size: 0.85rem; }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    <div class="ambient-bg">
        <div class="glow-spot spot-1"></div>
        <div class="glow-spot spot-2"></div>
    </div>
    <div class="card-river" id="card-river"></div>

    <div class="ui-layer">
        <header>
            <div class="settings-trigger" onclick="toggleModal('settings-modal', true)">⚙</div>
            <div class="logo">ECHO</div>
            <div class="slogan">“靠近我 听见我”</div>
        </header>

        <div class="stage">
            <div class="main-card" id="main-card">
                <div id="q-content">准备好了吗？</div>
            </div>
        </div>

        <div class="footer">
            <button class="btn-pulse" id="draw-btn" onclick="draw()">抽取问题</button>
            <div class="footer-links">
                <div class="link-item" onclick="toggleModal('reset-confirm-modal', true)">重置题库</div>
                <div class="link-item" onclick="toggleModal('history-modal', true)">历史记录</div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">SETTINGS</div>
            <div style="margin: 25px 0; color: #888; cursor:pointer" onclick="switchModal('settings-modal', 'import-modal')">导入新题库 ></div>
            <div style="margin: 25px 0; color: #888;" onclick="toggleModal('contact-modal', true)">联系开发者 ></div>
            <button class="btn-pulse" style="padding:10px 30px; font-size:0.8rem" onclick="toggleModal('settings-modal', false)">返回</button>
        </div>
    </div>

    <div id="import-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">导入题库</div>
            <textarea id="import-area" placeholder="每行一个话题..."></textarea>
            <div class="btn-group">
                <button class="btn-small btn-confirm" onclick="saveImport()">保存</button>
                <button class="btn-small btn-cancel" onclick="switchModal('import-modal', 'settings-modal')">取消</button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">历史记录</div>
            <div class="history-list" id="history-list"></div>
            <button class="btn-pulse" style="margin-top:25px; padding:10px 40px; font-size:0.8rem" onclick="toggleModal('history-modal', false)">关闭</button>
        </div>
    </div>

    <div id="reset-confirm-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">重置确认</div>
            <p style="color:#888; font-size:0.9rem;">确定要清空所有记录并恢复默认吗？</p>
            <div class="btn-group">
                <button class="btn-small btn-confirm" style="background:#cc0033" onclick="realReset()">确认重置</button>
                <button class="btn-small btn-cancel" onclick="toggleModal('reset-confirm-modal', false)">取消</button>
            </div>
        </div>
    </div>

    <div id="contact-modal" class="modal">
        <div class="modal-box">
            <div class="modal-title">开发者信息</div>
            <p style="color:var(--text-sub); font-size: 0.9rem;">QQ: 771668908</p>
            <button class="btn-small btn-confirm" style="width:100%" onclick="toggleModal('contact-modal', false)">知道了</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY_Q = 'echo_questions';
        const STORAGE_KEY_D = 'echo_drawn';
        let defaultQs = ["此时此刻，你最想对我做什么？", "如果我们的爱是一种颜色，你觉得是什么？", "分享一个你从未对我说过的幻想。", "你最喜欢我身体的哪个部位？", "闭上眼，描述一下你现在脑海里的我。"];
        let questions = JSON.parse(localStorage.getItem(STORAGE_KEY_Q)) || defaultQs;
        let drawn = JSON.parse(localStorage.getItem(STORAGE_KEY_D)) || [];

        // 1. 粒子系统
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class P { constructor(x, y) { this.x = x; this.y = y; this.size = Math.random()*3+1; this.sx = Math.random()*2-1; this.sy = Math.random()*2-1; this.life = 100; } u() { this.x += this.sx; this.y += this.sy; this.life -= 2; this.size *= 0.96; } d() { ctx.fillStyle = `rgba(255, 77, 109, ${this.life/200})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, 7); ctx.fill(); } }
        function handleIn(e) { let x = e.clientX || (e.touches && e.touches[0].clientX); let y = e.clientY || (e.touches && e.touches[0].clientY); if(x && y) for(let i=0;i<2;i++) particles.push(new P(x, y)); }
        window.addEventListener('mousemove', handleIn); window.addEventListener('touchmove', handleIn);
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach((p, i) => { p.u(); p.d(); if(p.life<=0) particles.splice(i, 1); }); requestAnimationFrame(anim); }
        anim();

        // 2. 核心抽卡逻辑
        const mainCard = document.getElementById('main-card');
        const qContent = document.getElementById('q-content');
        const drawBtn = document.getElementById('draw-btn');
        const audio = document.getElementById('draw-sound');

        // 初始化显示
        mainCard.style.opacity = "1";

        function draw() {
            let rem = questions.filter(q => !drawn.includes(q));
            if(rem.length === 0) { qContent.innerText = "话题已抽完"; return; }

            // 第一阶段：进入洗牌状态
            drawBtn.disabled = true;
            mainCard.classList.remove('drawing-active');
            mainCard.classList.add('shuffling');
            qContent.style.opacity = "0"; 

            // 第二阶段：物理反馈抛出
            setTimeout(() => {
                mainCard.classList.remove('shuffling');
                void mainCard.offsetWidth; // 强制刷新触发动画

                // 播放音效
                audio.currentTime = 0;
                audio.play().catch(()=>{});

                // 获取新话题
                let res = rem[Math.floor(Math.random() * rem.length)];
                drawn.push(res);
                localStorage.setItem(STORAGE_KEY_D, JSON.stringify(drawn));
                
                // 执行3D飞入
                qContent.innerText = res;
                mainCard.classList.add('drawing-active');

                // 第三阶段：文字延时呈现
                setTimeout(() => { 
                    qContent.style.opacity = "1"; 
                    drawBtn.disabled = false;
                }, 400);
            }, 600);
        }

        // 3. 弹窗与设置逻辑
        function toggleModal(id, show) {
            let m = document.getElementById(id);
            if(show) { m.style.display = 'flex'; setTimeout(()=>m.classList.add('show'), 10); }
            else { m.classList.remove('show'); setTimeout(()=>m.style.display='none', 400); }
            if(id === 'history-modal' && show) renderHistory();
        }
        function switchModal(from, to) { toggleModal(from, false); setTimeout(()=>toggleModal(to, true), 400); }
        function saveImport() {
            let val = document.getElementById('import-area').value;
            if(val.trim()) {
                questions = val.split('\n').filter(x => x.trim());
                drawn = [];
                localStorage.setItem(STORAGE_KEY_Q, JSON.stringify(questions));
                localStorage.setItem(STORAGE_KEY_D, JSON.stringify(drawn));
                toggleModal('import-modal', false);
                qContent.innerText = "新题库已就绪";
            }
        }
        function renderHistory() { document.getElementById('history-list').innerHTML = drawn.slice().reverse().map(q => `<div class="history-item">${q}</div>`).join('') || "<div class='history-item'>暂无记录</div>"; }
        function realReset() { localStorage.clear(); location.reload(); }

        // 背景流动卡片生成
        const river = document.getElementById('card-river');
        for(let i=0; i<15; i++) {
            let c = document.createElement('div'); c.className = 'phantom-card';
            c.style.setProperty('--x', (Math.random()*120-10)+'vw');
            c.style.setProperty('--z', (Math.random()*-500)+'px');
            c.style.setProperty('--o', (Math.random()*0.15));
            c.style.animationDuration = (Math.random()*12+8)+'s';
            c.style.animationDelay = (Math.random()*-20)+'s';
            river.appendChild(c);
        }
        document.getElementById('import-area').value = questions.join('\n');
    </script>
</body>
